# The timeline, newest entry first. The top entry gets the highlighted marker.
# tag is one of: record (on the record), reported (unnamed sources, not proven), denied (a rebuttal).
# sources are ids from sources.yml. Keep text inside double quotes.
# For a date range, add a label line under date, e.g. label: "5–6 November 2026".

- date: 2026-11-17
  headline: "U.S. Commerce and Justice Departments investigate Megaspeed"
  points:
    - tag: record
      text: "The U.S. Commerce and Justice Departments said they are investigating Megaspeed. They say the Commerce Department started in 2024. Commerce also says it had interviewed Alice Huang and conducted on-site checks at Megaspeed. The DOJ 'took the lead role' afterwards. The NYT previously reported that DOJ took over after an Nvidia intervention."
      sources: [doj-investigation, nyt-nov9]
    - tag: record
      text: "Nvidia's board has estabilished an independent committee to oversee Nvidia's national security and global trade compliance programs, following reports that its chips might have been illegally smuggled to China."
      sources: [nvidia-oversight-committee]
    - tag: record
      text: "Jensen Huang has agreed to testify before Congress on Tuesday 1 December 2026. On that day he wil appear before three separate House Committees. Nvidia's general counsel Tim Teter will follow a day later. As previously stated, Huang's testimony will be behind closed doors."
      sources: [huang-testimony-date]
      
- date: 2026-11-16
  headline: "Indonesian police reportedly raided Megaspeed, found empty server racks"
  points:
    - tag: reported
      text: "Indonesian police had raided Megaspeed's offices in the country earlier this year, according to The Strait Times. They reportedly found empty server racks without GPU's, its sources say."
      sources: [strait-times-raid]
    - tag: reported
      text: "Nvidia's board is not considering bringing back Jensen Huang as CEO, according to CNBC sources. Instead the board is focused on continuing its national security investigation into Huang."
      sources: [cnbc-huang-return]
      
- date: 2026-11-15
  headline: "Huang considers returning to Nvidia, Megaspeed opens internal investigation"
  points:
    - tag: reported
      text: "Huang is reportedly considering a comeback at Nvidia. The Financial Times reports that tech executives that support the ousted CEO have set up a 'war room' to lobby for his return. Huang reportedly supports the effort." 
      sources: [ft-huang-return]
    - tag: record
      text: "An open letter calling for Huang to be reinstated as CEO has garnered over 150,000 signatures. Among signees are reportedly over 7,300 current Nvidians, or about 17.5% of the company's employees. Notable tech CEO's like Elon Musk and Epic Games CEO Tim Sweeney also signed."
      sources: [open-letter]
    - tag: record
      text: "Megaspeed said that Alice Huang had officially left the company on 30 August 2025 and has no current role there."
      sources: [reuters-15nov-megaspeed]
    - tag: denied
      text: "The company also maintains it conducted 'legitimate and lawful' business, and that media reports 'aren't supported by verifiable evidence'. It has launched a 'thorough internal investigation'."
      sources: [reuters-15nov-megaspeed]

- date: 2026-11-14
  headline: "More details on internal Nvidia situation surface"
  points:
    - tag: reported
      text: "Huang had reportedly misled several of Nvidia's executives about his relationship with Alice Huang, including general counsel Tim Teter. He had repeatedly told them his interactions with Alice Huang reflected standard business dealings with customers, according to Reuters reporting."
      sources: [reuters-teter]
    - tag: reported
      text: "Huang reportedly also floated taking legal actions against the New York Times, after it published an article that first drew attention to his public meetings with Alice Huang. Ultimately, neither Nvidia nor Huang followed through. The NYT says it never received any legal demands."
      sources: [reuters-teter]

- date: 2026-11-13
  headline: "Democrats investigate Trump administration's handling of affair"
  points:
    - tag: record
      text: "Democrats opened an inquiry into the Trump administration's lack of action after reportedly receiving intelligence about Huang's affair. They asked Commerce Secretary Howard Lutnick to preserve records."
      sources: [techcrunch-dems, dems-letter]
    - tag: record
      text: "Lutnick has also been summoned to testify before the Senate Banking Committee, along with Mr. Huang. Republican Senator Tim Scott sent letters to both requesting their testimony next month."
      sources: [nyt-lutnick]
    - tag: reported
      text: "U.S. Intelligence Agencies reportedly aren't completely sure that Alice Huang is a Chinese intelligence asset. Multiple sources tell CNN that the intelligence collected on her so far does not provide definitive proof. They do emphasize that they still see the relationship as risky."
      sources: [cnn-intel]
    - tag: reported
      text: "Nvidia has approached Arm CEO Rene Haas in its search for a new CEO, reports the Financial Times. He'd previously worked for Nvidia. There's no guarantee he'll be offered the job or accept it, sources say."
      sources: [ft-haas]
    - tag: reported
      text: "As the board looks for a new chief executive, some Nvidia employees are calling for Huang to return. An internal post urging the board to reconsider has drawn over 1,600 comments, according to WIRED. Most are reportedly in favor of reinstating the former CEO."
      sources: [wired-post-forum]

- date: 2026-11-12
  headline: "Jensen Huang resigns as Nvidia CEO"
  points:
    - tag: record
      text: "Jensen Huang steps down as Nvidia's CEO. CFO Colette Kress will serve as interim CEO while the board looks for a permanent successor. The company is looking at both internal and external candidates, but it's unclear who's being considered."
      sources: [jensen-resigns]
    - tag: record
      text: "Huang has agreed to testify before Congress before Thanksgiving, according to Committee chairman Brian Mast. He says the hearing will be behind closed doors, but will likely be filmed and transcribed."
      sources: [bloomberg-congress]
    - tag: reported
      text: "Nvidia has tapped an outside firm to help find its next CEO, according to Bloomberg."
      sources: [bloomberg-ceo-search]
    - tag: reported
      text: "Reuters reports that Huang had a third affair, citing two people familiar with the matter. It reportedly involved another, unnamed Nvidia employee."
      sources: [third-affair]
      
- date: 2026-11-11
  headline: "NYT reports second affair, board considers firing Huang"
  points:
    - tag: record
      text: " Huang must accept the House briefing today or propose a new date. Committee chairman Brian Mast has said a subpoena is possible if he doesn't reply."
      sources: [house-briefing, reuters-subpoena]
    - tag: record
      text: "Republican U.S. Senator Kevin Cramer from the Senate Banking Committee calls on Huang to resign as Nvidia CEO, citing risks of extortion."
      sources: [cnbc-resign]
    - tag: reported
      text: "Huang allegedly had a second affair with an Nvidia executive who reported to him, according to The New York Times."
      sources: [nyt-second-affair]
    - tag: reported
      text: "Multiple media report Nvidia's board is preparing to oust Huang as CEO. The board was expected to meet Wednesday night, but hasn't made any decision public as of yet."
      sources: [board-prepares, board-meets]
      
- date: 2026-11-10
  headline: "Nvidia's investigation takes shape"
  points:
    - tag: record
      text: "Nvidia's board hires law firm Wachtell Lipton for its investigation, with former acting U.S. attorney Joon H. Kim leading the inquiry."
      sources: [board-nov10]
    - tag: record
      text: "Nvidia shares slide further, wiping out the stock's gains for 2026."
      sources: [stocks-2026]
    - tag: reported
      text: "The New York Times reports that President Trump was repeatedly briefed on intelligence about Huang's relationship with an alleged Chinese spy. He had denied any prior knowledge of the matter."
      sources: [nyt-nov10]
    - tag: reported
      text: "According to The Information, companies tied to Alice Huang have moved at least $7.5 billion worth of export-restricted Nvidia chips into China since 2023. Some reportedly ended up in data centers serving Alibaba and Tencent."      
      sources: [information-report]
    - tag: denied
      text: "A Chinese company named in that same report says it complies with applicable laws and has no dealings with Alice Huang. Megaspeed says U.S. inspections found no evidence of illicit chip transfers."
      sources: [information-report]

- date: 2026-11-09
  headline: "FBI looks into the affair"
  points:
    - tag: record
      text: "President Trump says the FBI is looking into Huang's affair with an alleged Chinese intelligence asset. He says Huang told him he didn't know of any such ties. President Trump also denies that he knew of the affair."
      sources: [ap-nov9]
    - tag: record
      text: "Markets open after Huang's admission, Nvidia's stock price slides 4%."
      sources: [cnn-stocks]
    - tag: record
      text: "Shareholders file a class action lawsuit, stating the risks associated with the relationship should have been disclosed."
      sources: [reuters-lawsuit]
    - tag: reported
      text: "Media report that the U.S. Department of Commerce transferred an investigation into Megaspeed to the Justice Department, after a top Nvidia executive reached out to officials."
      sources: [nyt-nov9]
    - tag: denied
      text: "Beijing denies espionage claims involving Nvidia's CEO, calling the reports a fabrication and a smear against China."
      sources: [nyt-denial]

      
- date: 2026-11-08
  headline: "Huang admits affair, board launches investigation"
  points:
    - tag: record
      text: "Huang releases a memo sent to employees of Nvidia. In it, he admits he was unfaithful to his wife, although he doesn't name the other person. He says he will stay on as CEO."
      sources: [nvidia-memo]
    - tag: record
      text: "Nvidia's board launches an independent investigation, following reports that its CEO was the target of a foreign intelligence effort. The board says it has no reason to believe national security or Nvidia secrets were compromised, and has confidence in Huang as CEO."
      sources: [board-nov8]

- date: 2026-11-07
  headline: "Reports of an affair"
  points:
    - tag: reported
      text: "U.S. officials believe the relationship between Huang and Alice Huang was 'romantic', according to the Financial Times."
      sources: [ft-nov7]

- date: 2026-11-06
  label: "5-6 November 2026"
  headline: "Reports name China's Ministry of State Security"
  points:
    - tag: record
      text: "Three House committee chairmen ask Mr. Huang for a closed-door briefing on 18 November."
      sources: [house-request]
    - tag: reported
      text: "The New York Times reports that U.S. intelligence assessed Alice Huang as working for China’s Ministry of State Security."
      sources: [nyt-nov6]

- date: 2026-10-29
  label: "29-30 October 2026"
  headline: "The story breaks"
  points:
    - tag: reported
      text: "The New York Times breaks the story. It alleges Nvidia CEO Jensen Huang had a close relationship with Alice Huang (not related), a Chinese businesswoman with alleged ties to Beijing. It also claims that President Trump was aware of said allegations and did not take action."
      sources: [nyt-oct29]
    - tag: denied
      text: "Huang tells Bloomberg his dealings with Alice Huang concerned Megaspeed, the company she worked for, and were normal business contact."
      sources: [bloomberg-oct29]
