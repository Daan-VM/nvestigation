# The timeline, newest entry first. The top entry gets the highlighted marker.
# tag is one of: record (on the record), reported (unnamed sources, not proven), denied (a rebuttal).
# sources are ids from sources.yml. Keep text inside double quotes.
# For a date range, add a label line under date, e.g. label: "5–6 November 2026".

- date: 2026-11-11
  headline: "House deadline for a briefing response"
  points:
    - tag: record
      text: "Jensen Huang must accept the House briefing today or propose a new date. Committee chairman Brian Mast has said a subpoena is possible if he doesn't reply."
      sources: [house-request, yahoo-gains]
    - tag: record
      text: "Republican U.S. Senator Kevin Cramer from the Senate Banking Committee calls on Huang to resign as Nvidia CEO, citing risks of extortion." 
    - tag: reported
      text: "Mr. Huang has pulled out of multiple appearances these past few days. He remains listed as keynote speaker at Nvidia’s GTC event in Washington next month."
      sources: [the-national]

- date: 2026-11-10
  headline: "Board investigation takes shape"
  points:
    - tag: record
      text: "Nvidia shares slide further, wiping out its gains for 2026."
      sources: [yahoo-gains]
    - tag: reported
      text: "Nvidia's board hires law firm Wachtell Lipton for its investigation, with former acting U.S. attorney Joon H. Kim leading the inquiry."
      sources: [fox-live]
    - tag: reported
      text: "The Information reports that companies tied to Alice Huang helped Chinese firms obtain about $7.5 billion worth of Nvidia chips."
      sources: [the-information, yahoo-live]
    - tag: denied
      text: "A Chinese company named in that same report says it complies with applicable laws and has no dealings with Alice Huang. Megaspeed says U.S. inspections found no evidence of illicit chip transfers."
      sources: [the-information, yahoo-live]

- date: 2026-11-09
  headline: "FBI involvement confirmed; China responds"
  points:
    - tag: record
      text: "President Trump says the FBI is looking into the matter. He also said Huang told him he did not know Alice Huang was a suspected Chinese spy."
      sources: [yahoo-live, newsweek]
    - tag: record
      text: "Shareholders propose a class action lawsuit, stating the risk associated with the relationship should have been disclosed."
      sources: [yahoo-gains]
    - tag: denied
      text: "Beijing says the allegation of espionage are unsubstantiated."
      sources: [newsweek]

- date: 2026-11-08
  headline: "Huang acknowledges an affair; board opens inquiry"
  points:
    - tag: record
      text: "In a memo to staff, Huang confirms he had an extramarital affair, apologises. He does not name anyone specifically, and says he wants to stay on as CEO."
      sources: [nvidia-memo]
    - tag: record
      text: "Nvidia’s board opens an independent investigation. In a statement, the board says it has no reason to believe national security or company secrets were compromised."
      sources: [nvidia-board]
    - tag: record
      text: "President Trump says he wants Huang to remain as Nvidia's CEO."
      sources: [stanford-daily]
    - tag: reported
      text: "The New York Times reports that a classified memo this spring warned senior U.S. officials about the relationship."
      sources: [business-standard]

- date: 2026-11-06
  label: "5–6 November 2026"
  headline: "Reports name China’s Ministry of State Security"
  points:
    - tag: reported
      text: "The New York Times reports that U.S. intelligence assessed Alice Huang as working for China’s Ministry of State Security. The Financial Times reports officials believed the relationship was romantic."
      sources: [nyt-nov6, business-standard]
    - tag: record
      text: "Three House committee chairmen ask Huang for a closed-door briefing on 18 November."
      sources: [house-request]

- date: 2026-10-29
  label: "29–30 October 2026"
  headline: "First reports"
  points:
    - tag: reported
      text: "The New York Times breaks the story. It alleges Nvidia CEO Jensen Huang had a close relationship with Alice Huang, a Chinese businesswoman with alleged ties to Beijing. It also claims that President Trump was aware of said allegations and did not take action."
      sources: [nyt-oct29, newsweek]
    - tag: denied
      text: "Huang tells Bloomberg his dealings with Alice Huang concerned Megaspeed, the company she worked for, and were normal business contact."
      sources: [newsweek]
