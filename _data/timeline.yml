# The timeline, newest entry first. The top entry gets the highlighted marker.
# tag is one of: record (on the record), reported (unnamed sources, not proven), denied (a rebuttal).
# sources are ids from sources.yml. Keep text inside double quotes.
# For a date range, add a label line under date, e.g. label: "5–6 November 2026".

- date: 2026-11-11
  headline: "Deadline day on Capitol Hill, second affair"
  points:
    - tag: record
      text: " Jensen Huang must accept the House briefing today or propose a new date. Committee chairman Brian Mast has said a subpoena is possible if he doesn't reply."
      sources: [house-briefing, reuters-subpoena]
    - tag: record
      text: "Republican U.S. Senator Kevin Cramer from the Senate Banking Committee calls on Huang to resign as Nvidia CEO, citing risks of extortion."
      sources: [cnbc-resign]
    - tag: reported
      text: "Mr. Huang allegedly had a second affair with an Nvidia executive who reported to him, according to the New York TImes."
      sources: [nyt-second-affair]
    - tag: reported
      text: "Multiple media report Nvidia's board is preparing to oust Mr. Huang as CEO. The board was expected to meet Wednesday night, but didn't make any decision public yet."

- date: 2026-11-10
  headline: "Board investigation takes shape"
  points:
    - tag: record
      text: "Nvidia's board hires law firm Wachtell Lipton for its investigation, with former acting U.S. attorney Joon H. Kim leading the inquiry."
      sources: [board-nov10]
    - tag: record
      text: "Nvidia shares slide further, wiping out its gains for 2026."
      sources: [stocks-2026]
    - tag: reported
      text: "According to The New York Times, President Trump was repeatedly briefed on intelligence showing that Mr. Huang's was in a relationship with an alleged Chinese spy. President Trump had denied any prior knowledge on the matter."
    - tag: reported
      text: "The Information reports that companies tied to Alice Huang helped Chinese firms obtain about $7.5 billion worth of Nvidia chips."
      sources: [information-report]
    - tag: denied
      text: "A Chinese company named in that same report says it complies with applicable laws and has no dealings with Alice Huang. Megaspeed says U.S. inspections found no evidence of illicit chip transfers."
      sources: [information-report]

- date: 2026-11-09
  headline: "FBI looks into affair"
  points:
    - tag: record
      text: "President Trump says the FBI is looking into Mr. Huang's affair with an alleged Chinese intelligence asset. He says Jensen told him he didn't know of any such ties. President Trump also denies that he knew of the affair."
      sources: [ap-nov9]
    - tag: record
      text: "Nvidia's stock price slides 4% after Mr. Huang admitted his affair."
      sources: [cnn-stocks]
    - tag: record
      text: "Shareholders propose a class action lawsuit, stating the risk associated with the relationship should have been disclosed."
      sources: [reuters-lawsuit]
    - tag: reported
      text: "Media reports that the U.S. Department of Commerce halted an investigation into Megaspeed after it received after a top Nvidia executive reached out to officials."
      sources: [nyt-nov9]

      
- date: 2026-11-08
  headline: "Jensen admits affair, board launches investigation"
  points:
    - tag: record
      text: "Jensen Huang releases a memo sent to employees of Nvidia. In it, he admits he was unfaithful to his wife, although he doesn't name the other person. He says he will stay on as CEO."
      sources: [nvidia-memo]
    - tag: record
      text: "The Nvidia board of directors launch an independent investigation, following reports that its CEO was the target of a foreign intelligence effort. The board says it has no reason to believe national security or Nvidia secrets were threatened, and has confidence in Mr. Huang."
      sources: [nvidia-nov8]

- date: 2026-11-07
  headline: "First reports of affair"
  points:
    - tag: reported
      text: "U.S. officials believe the relationship between Mr. Huang and Alice Huang was 'romantic', according to the Financial Times."
      sources: [ft-nov7]

- date: 2026-11-06
  label: "5-6 November 2026"
  headline: "Reports name China's Ministry of State Security"
  points:
    - tag: record
      text: "Three House committee chairmen ask Mr. Huang for a closed-door briefing on 18 November."
      sources: [house-request]
    - tag: reported
      text: "The New York Times reports that U.S. intelligence assessed Alice Huang as working for China’s Ministry of State Security."
      sources: [nyt-nov6]

- date: 2026-10-29
  label: "29–30 October 2026"
  headline: "First reports"
  points:
    - tag: reported
      text: "The New York Times breaks the story. It alleges Nvidia CEO Jensen Huang had a close relationship with Alice Huang (not related), a Chinese businesswoman with alleged ties to Beijing. It also claims that President Trump was aware of said allegations and did not take action."
      sources: [nyt-oct29]
    - tag: denied
      text: "Huang tells Bloomberg his dealings with Alice Huang concerned Megaspeed, the company she worked for, and were normal business contact."
      sources: [bloomberg-oct29]
