# The "Before the story broke" part of the timeline, newest first.

- label: "May 2026"
  tag: record
  text: "Culper Research publishes a report on Nvidia’s China exposure that mentions Megaspeed and Huang’s ties to Alice Huang. Culper had shorted Nvidia stock, meaning it makes money if the share prices fall."
  sources: [culper-report]

- label: "Spring 2026"
  tag: reported
  text: "Secretary of state Marco Rubio warns U.S. officials of Huang's relationship with a woman tied to Chinese intelligence, according to New York Times reporting."
  sources: [nyt-memo]

- label: "2025"
  tag: reported
  text: "The president is reportedly briefed on the intelligence. Huang lobbies for looser export restriction on chip shipments to China. President Trump allows conditional sales of Nvidia H200 chips to China."
  sources: [nyt-oct29, information-report, cnn-h200]

- label: "2024"
  - tag: reported
    text: "The two reportedly meet at an Nvidia event, although the exact timing remains unclear. A Megaspeed affiliate begins buying what becomes at least $4.8 billion of Nvidia-based equipment, and the Commerce Department starts examining Megaspeed."
    sources: [newsweek-timeline, information-report]

- label: "2023"
  - tag: record
    text: "Alice Huang becomes managing director of Megaspeed, which later joins an Nvidia partner programme."
    sources: [wsj-timeline, information-report]
  - tag: reported
    text: "She resigns as director by November, but continues to act as company leader."
    sources: [wsj-timeline, information-report]
