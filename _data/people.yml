# The "Who's who" panel, in the order shown.
# note is optional and appears in grey after the name.
# Keep allegations attributed, and include denials where there are any.

- name: "Jensen Huang"
  role: "Nvidia co-founder and former CEO. Led the company from its founding in 1993 until his resignation on 12 November 2026."

- name: "Alice Huang"
  note: "no relation"
  role: "Former Megaspeed executive. U.S. intelligence reportedly assessed she was a Chinese intelligence asset; this is unproven, and China denies it. Megaspeed says she left in August 2025."
  
- name: "Nvidia"
  role: "Under scrutiny over its former CEO's conduct and whether its chips reached China despite export controls."

- name: "Megaspeed"
  role: "Singapore-based cloud computing company and major Nvidia customer. Under U.S. investigation over possible export-control violations by providing access to Nvidia chips to China. Denies any wrongdoing."
  
- name: "Colette Kress"
  role: "Nvidia's chief financial officer. Interim CEO since 12 November 2026, following Huang's resignation."

- name: "Tim Teter"
  role: "Nvidia general counsel. Reportedly misled by Huang, and reportedly urged the board to investigate. Due to appear before House committees on 2 December."
  
- name: "Donald Trump"
  role: "U.S. president. Says the FBI is looking into the matter. The New York Times reports he was briefed on the intelligence beforehand; he denies prior knowledge."
  
- name: "Howard Lutnick"
  role: "U.S. Commerce Secretary, under bipartisan pressure over why his department didn't blacklist Megaspeed sooner. Due to testify before the Senate Banking Committee on 10 December."
